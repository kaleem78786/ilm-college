# Host Nginx terminates TLS; the tested Docker container listens only on localhost.
server {
    listen 80;
    listen [::]:80;
    server_name 54.81.201.196 lunphudi.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ilm-college;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lunphudi.com;
    ssl_certificate /etc/letsencrypt/live/lunphudi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lunphudi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ILM_SSL:10m;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ilm-college;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
