# setup-ec2.sh replaces __SERVER_HOST__ with your public IPv4 or domain.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_HOST__;

    root /var/www/ilm-college;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
