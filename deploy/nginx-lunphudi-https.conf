# Enable only AFTER issuing the lunphudi.com certificate.
# HTTP remains available while Cloudflare's encryption settings are configured.
server {
    listen 80;
    listen [::]:80;
    server_name 54.81.201.196 lunphudi.com;
    root /var/www/ilm-college;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ =404; }
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location ~ /\. { deny all; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lunphudi.com;
    ssl_certificate /etc/letsencrypt/live/lunphudi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lunphudi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ILM_SSL:10m;
    root /var/www/ilm-college;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
