name: Test every push and deploy main

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Static checks, Docker build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci
      - name: Validate HTML, assets, scripts and configuration
        run: npm run test:static
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the production Docker image
        run: |
          docker compose config --quiet
          docker build --build-arg "SITE_REVISION=$GITHUB_SHA" --tag "ilm-college:$GITHUB_SHA" .
          docker run --detach --name ilm-test --publish 127.0.0.1:8080:80 "ilm-college:$GITHUB_SHA"
      - name: Verify container HTTP content and revision
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8080/ --output "$RUNNER_TEMP/ilm-index.html"; then break; fi
            sleep 1
          done
          grep --fixed-strings --quiet 'ASAD BHUTTA' "$RUNNER_TEMP/ilm-index.html"
          grep --fixed-strings --quiet 'id="creatorPopup"' "$RUNNER_TEMP/ilm-index.html"
          test "$(curl --fail --silent --show-error http://127.0.0.1:8080/version.txt)" = "$GITHUB_SHA"
      - name: Exercise the built website in Chromium
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npm run test:browser
      - name: Save the exact tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir release
          docker save --output release/image.tar "ilm-college:$GITHUB_SHA"
          cd release
          sha256sum image.tar > image.tar.sha256
      - name: Upload immutable release artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs ilm-test 2>/dev/null || true
          docker rm --force ilm-test 2>/dev/null || true

  deploy:
    name: Deploy tested image and check production
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Serial deployments plus the live main-head checks stop a slow old build
    # from replacing a newer release. Running SSH deployments are not cancelled.
    concurrency:
      group: ilm-college-production
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      SITE_URL: ${{ vars.SITE_URL || 'https://lunphudi.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check this commit is still the production branch head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$head_sha" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this older release will not deploy.'
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.head.outputs.current == 'true'
        with:
          name: docker-image-${{ github.sha }}
          path: release/
      - name: Verify artifact checksum
        if: steps.head.outputs.current == 'true'
        working-directory: release
        run: sha256sum --check image.tar.sha256
      - name: Configure verified SSH access
        if: steps.head.outputs.current == 'true'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$ ]] || { echo 'Set a valid EC2_HOST secret.'; exit 1; }
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Set a valid EC2_USER secret.'; exit 1; }
          [[ -n "$EC2_SSH_KEY" && -n "$EC2_KNOWN_HOSTS" ]] || { echo 'EC2_SSH_KEY and verified EC2_KNOWN_HOSTS secrets are required.'; exit 1; }
          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ilm_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$RUNNER_TEMP/ilm_known_hosts"
      - name: Transfer the tested image and deployment script
        if: steps.head.outputs.current == 'true'
        id: transfer
        run: |
          remote_dir="/home/$EC2_USER/ilm-college-upload/releases/$GITHUB_SHA-$GITHUB_RUN_ID"
          ssh_options=(-F /dev/null -i "$RUNNER_TEMP/ilm_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ilm_known_hosts" -o ConnectTimeout=15)
          ssh "${ssh_options[@]}" "$EC2_USER@$EC2_HOST" "mkdir -p '$remote_dir'"
          scp "${ssh_options[@]}" release/image.tar release/image.tar.sha256 deploy/deploy-image.sh deploy/nginx-container-proxy.conf "$EC2_USER@$EC2_HOST:$remote_dir/"
      - name: Deploy only if this commit is still current
        if: steps.head.outputs.current == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit arrived during transfer; skipping this deployment.'
            exit 0
          fi
          remote_dir="/home/$EC2_USER/ilm-college-upload/releases/$GITHUB_SHA-$GITHUB_RUN_ID"
          ssh -F /dev/null -i "$RUNNER_TEMP/ilm_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ilm_known_hosts" -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" "bash '$remote_dir/deploy-image.sh' '$remote_dir/image.tar' 'ilm-college:$GITHUB_SHA' '$GITHUB_SHA'"
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Check public HTTPS content and exact deployed revision
        if: steps.release.outputs.deployed == 'true'
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 20 "$SITE_URL/" --output "$RUNNER_TEMP/ilm-production.html"
          grep --fixed-strings --quiet 'ASAD BHUTTA' "$RUNNER_TEMP/ilm-production.html"
          grep --fixed-strings --quiet 'id="creatorPopup"' "$RUNNER_TEMP/ilm-production.html"
          test "$(curl --fail --silent --show-error --location --retry 3 --max-time 20 "$SITE_URL/version.txt?release=$GITHUB_SHA")" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.release.outputs.deployed == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Install production browser checks
        if: steps.release.outputs.deployed == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify popup and interactions on the live website
        if: steps.release.outputs.deployed == 'true'
        env:
          BASE_URL: ${{ env.SITE_URL }}
        run: npm run test:browser
      - name: Save production browser diagnostics
        if: always() && steps.release.outputs.deployed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-browser-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove runner SSH credentials
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/ilm_key" && -f "$RUNNER_TEMP/ilm_known_hosts" ]]; then
            remote_dir="/home/$EC2_USER/ilm-college-upload/releases/$GITHUB_SHA-$GITHUB_RUN_ID"
            ssh -F /dev/null -i "$RUNNER_TEMP/ilm_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ilm_known_hosts" -o ConnectTimeout=15 \
              "$EC2_USER@$EC2_HOST" "rm -f -- '$remote_dir/image.tar' '$remote_dir/image.tar.sha256'" || true
          fi
          rm -f -- "$RUNNER_TEMP/ilm_key" "$RUNNER_TEMP/ilm_known_hosts"
