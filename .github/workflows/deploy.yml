name: CI/CD Pipeline - ILM College

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # STAGE 1: Linting & Code Quality Validation
  # ------------------------------------------------------------------
  lint-and-validate:
    name: 1. Code Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript Syntax
        run: |
          echo "Validating JavaScript syntax..."
          node -c site/script.js
          echo "✓ JavaScript syntax is valid."

      - name: Verify Required Files
        run: |
          echo "Verifying required project files..."
          required_files=(
            "site/index.html"
            "site/style.css"
            "site/script.js"
            "deploy/setup-ec2.sh"
            "deploy/nginx.conf"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file $file is missing!"
              exit 1
            fi
          done
          echo "✓ All core website and deployment files are present."

  # ------------------------------------------------------------------
  # STAGE 2: Security & Secrets Scan
  # ------------------------------------------------------------------
  security-scan:
    name: 2. Security & Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Leaked Keys & Secrets
        run: |
          echo "Scanning repository for accidental credentials..."
          leaked_files=$(find . -type f \( -name "*.pem" -o -name "*.key" -o -name ".env*" -o -name "*id_rsa*" \) | grep -v "/\.git/" || true)
          if [ -n "$leaked_files" ]; then
            echo "SECURITY ALERT: The following sensitive files were found in repo:"
            echo "$leaked_files"
            echo "Deployment halted to protect credentials."
            exit 1
          fi
          echo "✓ No private keys or secret files detected."

  # ------------------------------------------------------------------
  # STAGE 3: Build & Asset Integrity Smoke Test
  # ------------------------------------------------------------------
  build-and-test:
    name: 3. Asset Integrity & Smoke Test
    needs: [lint-and-validate, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Forbidden Symbolic Links
        run: |
          echo "Checking for symbolic links in site directory..."
          symlinks=$(find site/ -type l)
          if [ -n "$symlinks" ]; then
            echo "Error: Symlinks are forbidden in site/: $symlinks"
            exit 1
          fi
          echo "✓ No symbolic links found."

      - name: Verify Static Assets
        run: |
          echo "Verifying assets directory..."
          test -d site/assets || (echo "Missing site/assets directory" && exit 1)
          test -f site/assets/favicon.svg || (echo "Missing favicon" && exit 1)
          echo "✓ Asset structure is intact."

  # ------------------------------------------------------------------
  # STAGE 4: Automated Deployment to AWS EC2
  # ------------------------------------------------------------------
  deploy:
    name: 4. Deploy to AWS EC2
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Connection & Instance Status
        run: |
          echo "Verifying AWS identity..."
          aws sts get-caller-identity
          echo "Checking EC2 instance state for ${{ secrets.EC2_HOST }}..."
          state=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${{ secrets.EC2_HOST }}" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "EC2 instance status: $state"
          if [ "$state" != "running" ]; then
            echo "Error: EC2 instance is not in running state (found: $state)"
            exit 1
          fi
          echo "✓ EC2 instance is healthy and running."

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload Files to EC2
        run: |
          echo "Syncing code to EC2 upload directory..."
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p /home/${{ secrets.EC2_USER }}/ilm-college-upload"
          scp -r site deploy ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/ilm-college-upload/
          echo "✓ Files uploaded successfully."

      - name: Execute Deployment & Reload Nginx
        run: |
          echo "Executing setup script on remote server..."
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "cd /home/${{ secrets.EC2_USER }}/ilm-college-upload && bash deploy/setup-ec2.sh ${{ secrets.EC2_HOST }}"
          echo "✓ Remote setup and Nginx reload complete."

  # ------------------------------------------------------------------
  # STAGE 5: Live Production Health Check
  # ------------------------------------------------------------------
  health-check:
    name: 5. Live Production Health Check
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Live Endpoint Responds with HTTP 200
        run: |
          echo "Verifying live deployment at http://${{ secrets.EC2_HOST }}..."
          status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://${{ secrets.EC2_HOST }})
          if [ "$status_code" != "200" ]; then
            echo "Error: Server returned HTTP $status_code (Expected 200 OK)"
            exit 1
          fi
          echo "✓ Server is responding with HTTP 200 OK."

      - name: Verify Live Website Content
        run: |
          echo "Verifying website content..."
          curl -s --max-time 15 http://${{ secrets.EC2_HOST }} | grep -q "ilm\."
          echo "✓ ILM College brand content confirmed on production server!"
